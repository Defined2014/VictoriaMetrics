global:
  scrape_interval: 15s

scrape_configs:
- job_name: vmagent
  static_configs:
  - targets:
    - vmagent:8429
- job_name: vmalert
  static_configs:
  - targets:
    - vmalert:8880
- job_name: victoriametrics
  static_configs:
  - targets:
    - victoriametrics:8428
- job_name: 'tidb'
  static_configs:
  - targets:
    - host.docker.internal:10080
    - host.docker.internal:10081
